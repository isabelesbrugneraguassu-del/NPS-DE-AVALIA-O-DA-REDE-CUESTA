<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Como foi sua visita — Cuesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TOKENS — troque este bloco pelas cores reais da Cuesta.
     ============================================================ */
  :root{
    --green:#134E33;--green-deep:#0d3826;--honey:#E4952B;--honey-text:#3a2708;
    --ink:#18241E;--muted:#5E6B63;--line:#E4E7E1;--soft:#F5F7F3;--tint:#EAF2EC;--sheet:#F1F4EE;
    --r:18px;
    --display:"Bricolage Grotesque", system-ui, sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:var(--body);color:var(--ink);background:var(--green);line-height:1.45;-webkit-font-smoothing:antialiased}

  .frame{max-width:430px;margin:0 auto;min-height:100dvh;height:100dvh;display:flex;flex-direction:column;position:relative;background:var(--sheet);box-shadow:0 0 0 1px rgba(0,0,0,.05);overflow:hidden}

  /* HERO */
  .hero{flex:none;background:linear-gradient(165deg,#195c3f 0%,#103a28 100%);color:#fff;padding:18px 20px 44px;position:relative;overflow:hidden}
  .hero:after{content:"";position:absolute;right:-46px;top:-46px;width:160px;height:160px;border-radius:50%;background:rgba(228,149,43,.20)}
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:2}
  .brand{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;color:#fff}
  .ctx{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);padding:6px 11px;border-radius:999px;font-size:12px;color:#eaf3ee;font-weight:600}
  .ctx b{color:#fff}
  .ctx .dot{width:7px;height:7px;border-radius:50%;background:#F0B357}
  .pips{display:flex;gap:6px;margin:16px 0 0;position:relative;z-index:2}
  .pip{height:4px;flex:1;border-radius:99px;background:rgba(255,255,255,.22);transition:background .35s}
  .pip.done{background:rgba(255,255,255,.9)}
  .pip.now{background:#F0B357}
  .hero-q{position:relative;z-index:2;margin-top:20px}
  .kick{font-size:12.5px;font-weight:700;color:#bfe0cd;margin-bottom:7px;letter-spacing:.01em}
  h1{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:25px;line-height:1.16;margin:0;color:#fff}
  .qsub{color:rgba(255,255,255,.82);font-size:14.5px;margin:8px 0 0}

  /* SHEET */
  .sheet{flex:1;background-color:var(--sheet);background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27430%27%20height%3D%27260%27%20viewBox%3D%270%200%20430%20260%27%20preserveAspectRatio%3D%27none%27%3E%3Cpath%20d%3D%27M0%20120C90%2086%20170%2098%20250%20120%20330%20140%20385%20130%20430%20112V260H0Z%27%20fill%3D%27%23E4EFDC%27%2F%3E%3Cpath%20d%3D%27M0%20156C110%20128%20210%20138%20305%20156%20365%20167%20400%20162%20430%20154V260H0Z%27%20fill%3D%27%23D3E7C9%27%2F%3E%3C%2Fsvg%3E"),radial-gradient(135% 55% at 100% -8%,rgba(23,89,59,.07),transparent 60%),radial-gradient(95% 45% at -12% 108%,rgba(228,149,43,.08),transparent 55%),radial-gradient(rgba(23,89,59,.045) 1.1px,transparent 1.1px);background-position:bottom center,0 0,0 0,0 0;background-repeat:no-repeat,no-repeat,no-repeat,repeat;background-size:100% auto,auto,auto,22px 22px;margin-top:-28px;border-radius:26px 26px 0 0;position:relative;z-index:3;overflow-y:auto;padding:24px 20px 140px;display:flex;flex-direction:column;box-shadow:0 -10px 30px -16px rgba(0,0,0,.28)}
  .sheet>.anim-in{flex:1;display:flex;flex-direction:column}
  .sheet>.anim-in.center{justify-content:center}
  @media (prefers-reduced-motion:no-preference){
    .anim-in{animation:in .34s cubic-bezier(.2,.7,.2,1)}
    @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  }
  @keyframes starpop{0%{transform:scale(.8)}55%{transform:scale(1.32)}100%{transform:scale(1)}}
  @keyframes optpop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
  @keyframes npspop{0%{transform:scale(.85)}55%{transform:scale(1.15)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){.star.pop,.opt.sel,.nps button.sel{animation:none!important}}

  /* estrelas */
  .stars{display:flex;justify-content:center;gap:6px;margin:4px 0 4px}
  .star{width:50px;height:50px;border:0;background:transparent;padding:5px;cursor:pointer;color:#E1E5DF;transition:transform .18s cubic-bezier(.34,1.56,.64,1),color .2s}
  .star svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 5px rgba(228,149,43,0))}
  .star:hover{transform:translateY(-3px)}
  .star.on{color:var(--honey)}
  .star.on svg{filter:drop-shadow(0 3px 7px rgba(228,149,43,.4))}
  .star:active{transform:scale(.86)}
  .star.pop{animation:starpop .42s cubic-bezier(.34,1.56,.64,1)}
  .star-label{text-align:center;color:var(--muted);font-size:14px;font-weight:600;min-height:20px;margin-top:6px}

  /* opções */
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:linear-gradient(180deg,#FFFFFF,#F5F8F3);border:1.5px solid #E4EAE0;border-radius:var(--r);padding:14px 15px;cursor:pointer;font-size:16px;font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(20,30,25,.03);transition:border-color .18s,background .18s,box-shadow .2s,transform .18s cubic-bezier(.34,1.56,.64,1)}
  .opt:hover{transform:translateY(-2px);border-color:#d6ded7}
  .opt:active{transform:scale(.98)}
  .opt.sel{border-color:var(--green);background:var(--tint);box-shadow:0 8px 18px -10px rgba(23,89,59,.55);animation:optpop .38s cubic-bezier(.34,1.56,.64,1)}
  /* ícones desenhados (figurinhas) */
  .opt .ico{width:40px;height:40px;flex:none;display:grid;place-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;color:var(--green);box-shadow:0 2px 6px -3px rgba(0,0,0,.12);transition:transform .22s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s,box-shadow .2s}
  .opt .ico svg{width:22px;height:22px}
  .opt.sel .ico{transform:scale(1.06) rotate(-3deg);background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 13px -4px rgba(23,89,59,.4)}
  .opt.sel .check{opacity:1;transform:scale(1) rotate(0)}
  .opt .check{margin-left:auto;width:23px;height:23px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;opacity:0;transform:scale(.4) rotate(-25deg);transition:.25s cubic-bezier(.34,1.56,.64,1);font-size:13px;flex:none}
  .opt .check svg{width:14px;height:14px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .grid .opt{padding:13px 12px;font-size:15px}
  .grid .opt .ico{width:38px;height:38px}
  .count{width:max-content;max-width:100%;margin:18px auto 0;font-size:13.5px;font-weight:700;color:var(--green);background:var(--tint);padding:8px 15px;border-radius:999px;opacity:0;transform:translateY(6px) scale(.9);transition:.24s cubic-bezier(.34,1.56,.64,1)}
  .count.on{opacity:1;transform:none}

  /* NPS */
  .nps{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 10px}
  .nps button{width:calc((100% - 40px)/6);min-width:44px;aspect-ratio:1;border:1.5px solid var(--line);background:#fff;border-radius:14px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer;font-family:var(--display);transition:transform .16s cubic-bezier(.34,1.56,.64,1),background .15s,border-color .15s,box-shadow .18s}
  .nps button:hover{border-color:#c7d0c8;transform:translateY(-2px)}
  .nps button:active{transform:scale(.9)}
  .nps button.sel{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 7px 16px -6px rgba(23,89,59,.55);animation:npspop .34s cubic-bezier(.34,1.56,.64,1)}
  .nps-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-top:-2px;padding:0 2px}

  textarea,input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:15px;font:inherit;font-size:16px;background:#fff;color:var(--ink);resize:none}
  textarea:focus,input:focus{outline:none;border-color:var(--green)}
  textarea::placeholder,input::placeholder{color:#9aa79f}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.4}
  .consent input{margin-top:2px;width:18px;height:18px;flex:none;accent-color:var(--green)}

  /* rodapé */
  footer{position:absolute;left:0;right:0;bottom:0;padding:14px 20px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--sheet) 76%,transparent);display:flex;flex-direction:column;gap:8px;z-index:4}
  .btn{width:100%;border:0;border-radius:19px;padding:17px;cursor:pointer;position:relative;overflow:hidden;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;transition:transform .12s,box-shadow .2s,background .18s,opacity .15s}
  .btn-primary{background:linear-gradient(180deg,#EFA640,#E4952B 55%,#D98A22);color:var(--honey-text);box-shadow:0 10px 24px -7px rgba(228,149,43,.6),inset 0 1px 0 rgba(255,255,255,.55)}
  .btn-primary::before{content:"";position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}
  .btn-primary:hover{box-shadow:0 13px 28px -8px rgba(228,149,43,.68),inset 0 1px 0 rgba(255,255,255,.6)}
  .btn-primary:active{transform:translateY(2px) scale(.99);box-shadow:0 4px 12px -4px rgba(228,149,43,.55),inset 0 1px 0 rgba(255,255,255,.4)}
  .btn-primary:disabled{background:#E7E3DA;color:#B4B0A6;box-shadow:none;cursor:default}
  .btn-primary:disabled::before{display:none}
  .btn-ghost{align-self:center;width:auto;background:transparent;color:var(--muted);font-weight:600;font-family:var(--body);font-size:14.5px;padding:9px 18px;border-radius:12px;cursor:pointer;transition:background .15s,color .15s}
  .btn-ghost:hover{background:var(--soft);color:var(--ink)}
  .row{display:flex;gap:10px;align-items:center}
  .back{width:48px;height:48px;flex:none;border:1.5px solid var(--line);background:#fff;border-radius:14px;color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center}
  .back:disabled{opacity:.35;cursor:default}

  /* CELEBRAÇÃO */
  .celebrate{flex:1;background:radial-gradient(78% 48% at 50% 1%,rgba(242,192,102,.42),transparent 46%),linear-gradient(180deg,#21744f 0%,#123f2a 60%,#0e3524 100%);color:#fff;display:flex;flex-direction:column;justify-content:safe center;align-items:center;text-align:center;padding:30px 24px calc(26px + env(safe-area-inset-bottom));position:relative;overflow-y:auto;overflow-x:hidden}
  .celebrate:after{content:"";position:absolute;right:-70px;bottom:-50px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(228,149,43,.22),transparent 70%)}
  .celebrate>*{position:relative;z-index:2}
  .seal-wrap{position:relative;width:96px;height:96px;margin:0 auto 22px;display:grid;place-items:center}
  .ripple{position:absolute;width:88px;height:88px;border-radius:50%;border:2px solid rgba(255,255,255,.4);opacity:0}
  @media (prefers-reduced-motion:no-preference){.ripple{animation:ripple 2.8s ease-out infinite}.ripple.r2{animation-delay:.9s}.ripple.r3{animation-delay:1.8s}}
  @keyframes ripple{0%{transform:scale(.7);opacity:.55}100%{transform:scale(2);opacity:0}}
  .seal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:#E9AE4E;background:linear-gradient(150deg,rgba(255,255,255,.34),rgba(255,255,255,.06));backdrop-filter:blur(9px) saturate(140%);-webkit-backdrop-filter:blur(9px) saturate(140%);border:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 1px rgba(255,255,255,.6),inset 0 -10px 22px rgba(0,0,0,.14),0 0 60px rgba(242,192,102,.42),0 14px 32px -8px rgba(0,0,0,.35);animation:pop .5s cubic-bezier(.2,.8,.2,1);position:relative;z-index:2;overflow:hidden;transition:transform .18s}\n  .seal::before{content:"";position:absolute;top:7%;left:13%;width:74%;height:40%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none;z-index:0}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1)}}
  .seal svg{width:28px;height:28px;position:relative;z-index:1}
  .celebrate h1{font-size:28px;line-height:1.14}
  .celebrate .csub{color:rgba(255,255,255,.82);font-size:15px;margin:12px 6px 0}
  .cnote{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:15px 16px;margin:24px 4px 0;font-size:14px;color:rgba(255,255,255,.94);text-align:left;display:flex;gap:12px;align-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
  .cnote .dn{flex:none;display:grid;place-items:center;color:#fff}
  .cnote .dn svg{width:24px;height:24px}
  .cactions{margin-top:28px;width:100%;display:flex;flex-direction:column;gap:11px}
  .btn-light{position:relative;overflow:hidden;background:linear-gradient(180deg,#ffffff,#eef3ee);color:var(--green);border-radius:19px;padding:16px;border:0;font-family:var(--display);font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 12px 26px -8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .12s,box-shadow .2s}
  .btn-light::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0));pointer-events:none}
  .btn-light:hover{box-shadow:0 16px 30px -8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.9)}
  .btn-light:active{transform:translateY(2px) scale(.99)}
  .btn-linklight{position:relative;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:16px;color:rgba(255,255,255,.92);font-size:14.5px;font-weight:600;cursor:pointer;padding:13px;font-family:var(--body);transition:background .15s}
  .btn-linklight:hover{background:rgba(255,255,255,.15)}
  .cel-hills{position:absolute;left:0;right:0;bottom:0;height:130px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27430%27%20height%3D%27130%27%20viewBox%3D%270%200%20430%20130%27%20preserveAspectRatio%3D%27none%27%3E%3Cpath%20d%3D%27M0%2060C90%2034%20180%2044%20260%2062%20330%2078%20385%2070%20430%2056V130H0Z%27%20fill%3D%27%230f3a25%27%2F%3E%3Cpath%20d%3D%27M0%2088C110%2066%20210%2074%20300%2090%20360%20100%20400%2096%20430%2090V130H0Z%27%20fill%3D%27%230b2c1b%27%2F%3E%3C%2Fsvg%3E") bottom center/100% 100% no-repeat;pointer-events:none;z-index:1}


  /* logo no topo */
  .brand{display:flex;align-items:center;gap:9px}
  .lg{background:#F8FAF5;border-radius:10px;padding:6px 10px;display:grid;place-items:center;flex:none;box-shadow:0 3px 9px -4px rgba(0,0,0,.22)}
  .lg img{height:30px;width:auto;display:block}
  .bwm{display:flex;flex-direction:column;line-height:1}
  .bw1{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;color:#121512}
  .bw2{font-size:7px;font-weight:700;letter-spacing:.26em;color:#EAC46C;margin-top:3px}
  /* mascote (Cuestinha) na tela final */
  .seal{cursor:pointer}
  @media (prefers-reduced-motion:no-preference){.seal svg{animation:beat 1.6s ease-in-out infinite}}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.16)}24%{transform:scale(1)}36%{transform:scale(1.09)}50%{transform:scale(1)}}
  .fly{position:absolute;top:12px;left:50%;width:20px;height:20px;color:#FFCF7A;pointer-events:none;animation:fly 1s ease-out forwards;z-index:4}
  .fly svg{width:100%;height:100%;display:block}
  @keyframes fly{0%{opacity:0;transform:translate(-50%,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-92px) scale(1) rotate(var(--dr))}}
  .cel-logo{margin:0 auto 18px;padding:14px 22px;border-radius:34px;background:radial-gradient(64% 58% at 50% 47%,rgba(255,255,255,.13),transparent 74%);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .cel-logo img{height:170px;width:auto;display:block;margin:0 auto}
  .offnote{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:11px 14px;margin:16px 6px 0;font-size:12.5px;color:rgba(255,255,255,.9);line-height:1.4}
  .offnote.ok{background:rgba(120,200,140,.22);border-color:rgba(160,220,170,.4)}
</style>
</head>
<body>

    const rows=await sbGet("qr_code?slug=eq."+encodeURIComponent(QR_SLUG)+"&select=id,codigo,empresa_id,ponto_id,campanha_id,ponto(loja_id,setor_id,loja(nome),setor(nome))&limit=1");
    const q=rows&&rows[0];
    if(q){
      CTX.qr_id=q.id; if(q.codigo)CTX.qr=q.codigo; CTX.empresa_id=q.empresa_id; CTX.ponto_id=q.ponto_id; CTX.campanha_id=q.campanha_id;
      const pt=q.ponto||{}; CTX.loja_id=pt.loja_id; CTX.setor_id=pt.setor_id;
      if(pt.loja&&pt.loja.nome)CTX.loja=pt.loja.nome;
      if(pt.setor&&pt.setor.nome)CTX.setor=pt.setor.nome;
      try{const pv=await sbRpc("pesquisa_ativa_do_qr",{p_qr:q.id});CTX.pesquisa_versao_id=(typeof pv==="string")?pv:(pv&&pv[0]?pv[0]:null);}catch(e){}
      try{sbPost("qr_acesso",{qr_code_id:q.id,dispositivo_hash:deviceHash()});}catch(e){}
      try{ if(CTX.pesquisa_versao_id){ const pr=await sbGet("pergunta?pesquisa_versao_id=eq."+CTX.pesquisa_versao_id+"&select=tipo,texto,config,opcao(texto,valor,icone,sentimento,ordem)&order=ordem"); aplicaPesquisa(pr); } }catch(e){}
      if(idx===0)render();
    }
  }catch(e){ /* sem internet: segue com o contexto padrão */ }
}

function buildPayload(){
  return {empresa_id:CTX.empresa_id,loja_id:CTX.loja_id,setor_id:CTX.setor_id,ponto_id:CTX.ponto_id,qr_code_id:CTX.qr_id,campanha_id:CTX.campanha_id,pesquisa_versao_id:CTX.pesquisa_versao_id,
    nota_geral:state.rating||null,nps:(state.recommend==null?null:state.recommend),encontrou:state.found,
    sentimento:(state.rating>=4?"positivo":(state.rating&&state.rating<=2?"negativo":"neutro")),
    dispositivo_hash:deviceHash(),
    detalhes:{liked:state.liked,gaps:state.gaps,improve:state.improve,notFound:state.notFound,horario:state.horario,precoPercep:state.precoPercep,atendDetalhe:state.atendDetalhe,faltou:state.faltou,limpezaLocal:state.limpezaLocal},
    _cid:"c_"+Date.now()+"_"+Math.random().toString(36).slice(2)};
}
function getFila(){try{return JSON.parse(localStorage.getItem("cuesta_fila")||"[]");}catch(e){return [];}}
function setFila(q){try{localStorage.setItem("cuesta_fila",JSON.stringify(q));}catch(e){}}
async function sendOne(item){
  const clean=Object.assign({},item); delete clean._cid;
  const rep=await sbPost("avaliacao",clean,"return=representation");
  const avalId=rep&&rep[0]&&rep[0].id; if(avalId)CTX.last_avaliacao_id=avalId;
  const prod=(clean.detalhes&&(clean.detalhes.notFound||clean.detalhes.faltou))||"";
  if(prod&&prod.trim()){try{await sbPost("produto_mencionado",{avaliacao_id:avalId,loja_id:clean.loja_id,setor_id:clean.setor_id,texto_cru:prod.trim()});}catch(e){}}
}
async function flushQueue(){
  const q=getFila(); const rest=[];
  for(const it of q){ try{await sendOne(it);}catch(e){rest.push(it);} }
  setFila(rest); return rest.length===0;
}
async function saveEvaluation(){
  const pl=buildPayload();
  const q=getFila(); q.push(pl); setFila(q);
  try{ await sendOne(pl); setFila(getFila().filter(x=>x._cid!==pl._cid)); return true; }
  catch(e){ return false; }
}
async function saveChamado(){
  const body={empresa_id:CTX.empresa_id,loja_id:CTX.loja_id,setor_id:CTX.setor_id,avaliacao_id:CTX.last_avaliacao_id,nome:state.contactName||null,whatsapp:state.contactPhone||null,mensagem:state.supportMsg||null,consentimento_lgpd:true,consentimento_em:new Date().toISOString()};
  try{await sbPost("chamado",body);return true;}catch(e){try{const q=JSON.parse(localStorage.getItem("cuesta_chamados")||"[]");q.push(body);localStorage.setItem("cuesta_chamados",JSON.stringify(q));}catch(e2){}return false;}
}

const BLANK={rating:0,found:null,liked:[],gaps:[],recommend:null,improve:"",notFound:"",contactName:"",contactPhone:"",contactOk:false,supportMsg:"",horario:null,precoPercep:null,atendDetalhe:null,faltou:"",limpezaLocal:null};
let state={...BLANK};
const RATING_WORDS=["","Que pena","Podia ser melhor","Foi ok","Foi boa","Foi ótima!"];

function buildFlow(){
  const f=["rating","found"];
  if(state.found==="nao") f.push("notfound");
  if(state.rating>=3) f.push("liked");                   // quem gostou responde PRIMEIRO o que agradou
  if(state.rating>0&&state.rating<=4) f.push("gaps");   // depois, o que da pra melhorar
  followupTopics().forEach(t=>f.push("fu:"+t));           // uma pergunta-filha por incomodo marcado
  f.push("recommend","improve","done");
  return f;
}
function posSet(){if(CTX.surveyPos)return CTX.surveyPos;const s=FACTOR_SETS[SECTOR]||FACTOR_SETS.default;return s.pos;}
function negSet(){if(CTX.surveyNeg)return CTX.surveyNeg;const s=FACTOR_SETS[SECTOR]||FACTOR_SETS.default;return s.neg;}
function aplicaPesquisa(perguntas){
  if(!perguntas||!perguntas.length)return;
  let pos=null,neg=null,rating=null;
  perguntas.forEach(pg=>{
    if(pg.tipo==="estrelas"){rating=pg.texto;}
    else if(pg.tipo==="multipla"){
      const ops=(pg.opcao||[]).slice().sort((a,b)=>(a.ordem||0)-(b.ordem||0));
      const chave=(pg.config&&pg.config.chave)||((ops[0]&&ops[0].sentimento==="positivo")?"liked":"gaps");
      const arr=ops.map(o=>({k:o.valor,ic:DBICON[o.icone]||"grid",t:o.texto}));
      if(chave==="liked")pos=arr;else neg=arr;
    }
  });
  if(pos&&pos.length)CTX.surveyPos=pos;
  if(neg&&neg.length)CTX.surveyNeg=neg;
  if(rating)CTX.ratingText=rating;
}
function followupTopics(){
  return state.gaps.filter(k=>{
    if(!FOLLOWUPS[k]) return false;
    if(k==="disponibilidade" && state.notFound.trim()) return false; // já perguntamos no "não encontrei"
    return true;
  });
}
let idx=0;

const frame=document.getElementById("frame");
function el(h){const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild;}
function starSVG(){return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.2 6.6.7-4.9 4.5 1.3 6.6-5.9-3.4-5.9 3.4 1.3-6.6L2.5 9.4l6.6-.7z"/></svg>';}
function heartSVG(){return '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.3l-1.5-1.35C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.5 11.45L12 21.3z"/></svg>';}
function checkSVG(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7"/></svg>';}
function coreSteps(){return buildFlow().filter(s=>s!=="done");}
function ctxPill(){return `<span class="ctx"><span class="dot"></span> <b>${CTX.loja}</b> · ${CTX.setor}</span>`;}
function saudacao(){const x=new Date().getHours();return x<12?"Bom dia!":x<18?"Boa tarde!":"Boa noite!";}
/* monta uma opção grande com ícone */
function optBtn(sel,ic,label,multi){
  return `<button class="opt ${sel?"sel":""}"><span class="ico">${ICON(ic)}</span>${label}<span class="check">${checkSVG()}</span></button>`;
}
/* passo de múltipla escolha reutilizável (melhorar / agradou) */
function multiFactor(ctx,kick,title,sub,items,key){
  const {heroQ,body,footer}=ctx;
  setHero(heroQ,kick,title,sub);
  body.innerHTML='<div class="grid" id="g"></div><div class="count" id="cnt"></div>';
  const box=body.querySelector("#g"),cnt=body.querySelector("#cnt");
  function refresh(){const n=state[key].length;cnt.className="count"+(n?" on":"");cnt.textContent=n?`${n} ${n>1?"escolhas ouvidas":"escolha ouvida"} ✓`:"";p.disabled=n===0;}
  items.forEach(it=>{
    const b=el(optBtn(state[key].includes(it.k),it.ic,it.t,true));
    b.onclick=()=>{const a=state[key];const i=a.indexOf(it.k);if(i>=0){a.splice(i,1);b.classList.remove("sel");}else{a.push(it.k);b.classList.add("sel");}refresh();};
    box.appendChild(b);
  });
  const p=footerNav(footer,"Continuar",state[key].length>0,next);
  refresh();
}

function scaffold(withPips){
  const cur=buildFlow()[idx];
  let pips="";
  if(withPips){
    const core=coreSteps();
    pips='<div class="pips">'+core.map((s,i)=>{const cls=core.indexOf(cur)>i?"done":(core[i]===cur?"now":"");return `<div class="pip ${cls}"></div>`;}).join("")+'</div>';
  }
  frame.innerHTML=`
    <div class="hero"><div class="hero-top"><span class="lg"><img src="${ASSET_ICON}" alt="Cuesta Supermercados"></span>${ctxPill()}</div>${pips}<div class="hero-q" id="heroQ"></div></div>
    <div class="sheet" id="sheet"><div class="anim-in" id="body"></div></div>
    <footer id="footer"></footer>`;
  return {heroQ:frame.querySelector("#heroQ"),body:frame.querySelector("#body"),footer:frame.querySelector("#footer")};
}
function setHero(heroQ,kick,h1,sub){heroQ.innerHTML=`<div class="kick">${kick}</div><h1>${h1}</h1>${sub?`<p class="qsub">${sub}</p>`:""}`;}
function footerNav(footer,label,enabled,onNext,opts={}){
  footer.innerHTML="";
  const row=el('<div class="row"></div>');
  const back=el('<button class="back" aria-label="Voltar">‹</button>');
  back.disabled=idx===0;back.onclick=goBack;row.appendChild(back);
  const p=el(`<button class="btn btn-primary" style="flex:1" ${enabled?"":"disabled"}>${label}</button>`);
  p.onclick=()=>{if(!p.disabled)onNext();};row.appendChild(p);
  footer.appendChild(row);
  if(opts.skip){const s=el(`<button class="btn-ghost">${opts.skip.label}</button>`);s.onclick=opts.skip.onClick;footer.appendChild(s);}
  return p;
}

function render(){
  const step=buildFlow()[idx];
  if(step==="done"){renderCelebrate("done");return;}
  if(step.slice(0,3)==="fu:"){renderFollowup(scaffold(true),step.slice(3));return;}
  STEPS[step](scaffold(true));
}

const STEPS={
  rating({heroQ,body,footer}){
    setHero(heroQ,saudacao(),CTX.ratingText||("Como foi sua visita à "+CTX.setor+" hoje?"),"Sua opinião ajuda a Cuesta a melhorar de verdade 💚");
    body.classList.add("center");
    body.innerHTML=`<div class="stars" id="s"></div><div class="star-label" id="l">${state.rating?RATING_WORDS[state.rating]:""}</div>`;
    const wrap=body.querySelector("#s"),lab=body.querySelector("#l");
    for(let i=1;i<=5;i++){
      const s=el(`<button class="star ${i<=state.rating?"on":""}" aria-label="${i} estrela${i>1?"s":""}">${starSVG()}</button>`);
      s.onclick=()=>{state.rating=i;[...wrap.children].forEach((c,k)=>c.classList.toggle("on",k<i));s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");lab.textContent=RATING_WORDS[i];setTimeout(next,430);};
      wrap.appendChild(s);
    }
    footerNav(footer,"Continuar",state.rating>0,next);
  },

  found({heroQ,body,footer}){
    setHero(heroQ,"Sobre os produtos","Você encontrou tudo que precisava?","Assim a gente repõe o que falta com atenção.");
    body.classList.add("center");
    const opts=[{k:"tudo",ic:"check",t:"Encontrei tudo"},{k:"quase",ic:"dash",t:"Encontrei quase tudo"},{k:"nao",ic:"x",t:"Não encontrei"}];

      const b=el(optBtn(state.found===o.k,o.ic,o.t));
      b.onclick=()=>{state.found=o.k;[...box.children].forEach(c=>c.classList.remove("sel"));b.classList.add("sel");setTimeout(next,300);};
      box.appendChild(b);
    });
    footerNav(footer,"Continuar",!!state.found,next);
  },

  notfound({heroQ,body,footer}){
    setHero(heroQ,"Conta pra gente","O que faltou na sua visita?","Escreve do seu jeito — a gente lê com atenção.");
    body.classList.add("center");
    body.innerHTML=`<input type="text" id="nf" placeholder="Ex: leite sem lactose 1L" value="${state.notFound}">`;

    footerNav(footer,"Continuar",true,next,{skip:{label:"Prefiro não dizer",onClick:()=>{state.notFound="";next();}}});
  },

  gaps(ctx){
    const four=state.rating===4;
    const title=four?"O que faltou pra ser 5 estrelas?":"No que a gente pode melhorar?";
    const kick=four?"Quase perfeito ⭐":"Pode marcar vários";
    multiFactor(ctx,kick,title,"Sua resposta vai direto pra quem pode mudar isso.",negSet(),"gaps");
  },

  liked(ctx){
    multiFactor(ctx,"Pode marcar vários","O que mais te agradou hoje?","Marca tudo que fez bem à sua visita.",posSet(),"liked");
  },

  recommend({heroQ,body,footer}){
    setHero(heroQ,"Quase lá","Você recomendaria a Cuesta pra alguém?","De 0 a 10, com sinceridade.");
    body.classList.add("center");
    body.innerHTML='<div class="nps" id="n"></div><div class="nps-ends"><span>Não indicaria</span><span>Com certeza</span></div>';
    const box=body.querySelector("#n");
    for(let n=0;n<=10;n++){
      const b=el(`<button class="${state.recommend===n?"sel":""}">${n}</button>`);
      b.onclick=()=>{state.recommend=n;[...box.children].forEach(c=>c.classList.remove("sel"));b.classList.add("sel");setTimeout(next,320);};
      box.appendChild(b);

    footerNav(footer,"Continuar",state.recommend!==null,next,{skip:{label:"Pular",onClick:next}});

  improve({heroQ,body,footer}){
    const high=state.rating>=4;
    setHero(heroQ,high?"Se quiser":"Falta só isso",high?"Quer deixar um recado pra equipe? 💚":"O que deixaria sua próxima visita ainda melhor?","Pode ser curtinho — a gente valoriza cada palavra.");

/* ---------- pergunta-filha (uma por incômodo escolhido) ---------- */
function renderFollowup(ctx,topic){
  const {heroQ,body,footer}=ctx;
  const cfg=FOLLOWUPS[topic];
  if(!cfg){next();return;}
  setHero(heroQ,cfg.kick,cfg.h1,cfg.type==="text"?"Escreve do seu jeito — a gente entende.":"Toca na opção que combina.");
  body.classList.add("center");
  if(cfg.type==="text"){
    body.innerHTML=`<input type="text" id="ft" placeholder="${cfg.placeholder||""}" value="${state[cfg.key]||""}">`;
    const inp=body.querySelector("#ft");inp.oninput=()=>state[cfg.key]=inp.value;setTimeout(()=>inp.focus(),120);
    footerNav(footer,"Continuar",true,next,{skip:{label:"Prefiro não dizer",onClick:()=>{state[cfg.key]="";next();}}});
  }else{
    body.innerHTML='<div class="opts" id="o"></div>';
    const box=body.querySelector("#o");
    cfg.opts.forEach(o=>{
      const b=el(optBtn(state[cfg.key]===o.k,o.ic,o.t));
      b.onclick=()=>{state[cfg.key]=o.k;[...box.children].forEach(c=>c.classList.remove("sel"));b.classList.add("sel");setTimeout(next,300);};
      box.appendChild(b);
    });
    footerNav(footer,"Continuar",state[cfg.key]!=null,next);
  }
}

/* ---------- tela final ---------- */
function burstHearts(el){
  el.style.transform="scale(1.12)"; setTimeout(()=>{el.style.transform="";},190);
  const wrap=el.parentElement;
  for(let k=0;k<6;k++){
    const s=document.createElement("span");
    s.className="fly"; s.innerHTML=heartSVG();
    s.style.setProperty("--dx",(Math.random()*90-45)+"px");
    s.style.setProperty("--dr",(Math.random()*44-22)+"deg");
    s.style.animationDelay=(k*35)+"ms";
    wrap.appendChild(s);
    setTimeout(()=>s.remove(),1200);
  }
}
function renderCelebrate(type){
  const complained=state.rating>0&&state.rating<=2;
  let title,sub,extra="",offhtml="";
  if(type==="supportDone"){
    title="Chamado aberto";
    sub=`A equipe da ${CTX.loja} já recebeu o seu pedido. Você vai receber a resposta no WhatsApp \u2014 obrigado pela paciência. \ud83d\udc9a`;
  }else if(complained){
    title="Obrigado por ser sincero";
    sub="O que te incomodou já foi pra nossa equipe. A gente vai caprichar pra sua próxima visita ser bem melhor. Volte pra ver. \ud83d\udc9a";
    extra=`<button class="btn-linklight" id="support">Precisa de uma resposta? Falar com a loja</button>`;
  }else{
    title="Foi um prazer ter você aqui!";
    sub="Obrigado por contar como foi a sua visita. Volte sempre \u2014 a gente adora te ver por aqui. \ud83d\udc9a";
    extra=`<button class="btn-linklight" id="support">Precisa de uma resposta? Falar com a loja</button>`;
  }
  if(type!=="supportDone"){saveEvaluation();if(typeof navigator!=="undefined"&&!navigator.onLine)offhtml='<div class="offnote" id="offnote">Sem internet agora? Sua avaliação já ficou salva e vai sozinha quando a conexão voltar.</div>';}
  frame.innerHTML=`
    <div class="celebrate">
      <div class="cel-logo"><img src="${ASSET_LOGO_STACK}" alt="Cuesta Supermercados"></div>
      <div class="seal-wrap"><div class="seal">${heartSVG()}</div></div>
      <h1>${title}</h1>
      <p class="csub">${sub}</p>
      ${offhtml}
      <div class="cactions"><button class="btn-light" id="again">Avaliar outro setor da loja</button>${extra}</div>
      <div class="cel-hills"></div>
    </div>`;
  frame.querySelector("#again").onclick=restart;
  const seal=frame.querySelector(".seal");if(seal)seal.onclick=()=>burstHearts(seal);
  const sup=frame.querySelector("#support");if(sup)sup.onclick=renderSupport;
}

/* ---------- suporte (opt-in) ---------- */
function renderSupport(){
  frame.innerHTML=`
    <div class="hero"><div class="hero-top"><span class="lg"><img src="${ASSET_ICON}" alt="Cuesta Supermercados"></span>${ctxPill()}</div>
      <div class="hero-q"><div class="kick">Falar com a loja</div><h1>Quer que a gente resolva com você?</h1><p class="qsub">Isso abre um chamado direto com a equipe da ${CTX.loja}.</p></div></div>
    <div class="sheet"><div class="anim-in">
      <div class="opts">
        <input type="text" id="cn" placeholder="Seu nome" value="${state.contactName}">
        <input type="text" id="cp" placeholder="WhatsApp (com DDD)" inputmode="tel" value="${state.contactPhone}">
        <textarea id="cm" rows="3" placeholder="Como podemos ajudar?">${state.supportMsg}</textarea>
      </div>
      <label class="consent"><input type="checkbox" id="ck" ${state.contactOk?"checked":""}><span>Autorizo a Cuesta a usar meu contato só pra responder sobre este chamado. Nada de propaganda.</span></label>
    </div></div>
    <footer><div class="row"><button class="back" id="bk" aria-label="Voltar">‹</button><button class="btn btn-primary" id="ok" style="flex:1" disabled>Abrir chamado</button></div></footer>`;
  const cn=frame.querySelector("#cn"),cp=frame.querySelector("#cp"),cm=frame.querySelector("#cm"),ck=frame.querySelector("#ck"),ok=frame.querySelector("#ok");
  function sync(){ok.disabled=!(cn.value.trim()&&cp.value.trim()&&ck.checked);}
  cn.oninput=()=>{state.contactName=cn.value;sync();};
  cp.oninput=()=>{state.contactPhone=cp.value;sync();};
  cm.oninput=()=>state.supportMsg=cm.value;
  ck.onchange=()=>{state.contactOk=ck.checked;sync();};
  frame.querySelector("#bk").onclick=()=>renderCelebrate("done");
  ok.onclick=()=>{if(!ok.disabled){saveChamado();renderCelebrate("supportDone");}};
  sync();
}

function next(){const f=buildFlow();if(idx<f.length-1){idx++;render();}}
function goBack(){if(idx>0){idx--;render();}}
function restart(){state={...BLANK};idx=0;render();}
window.addEventListener("online",function(){flushQueue().then(function(ok){var o=document.getElementById("offnote");if(o&&ok){o.textContent="Tudo certo \u2014 sua avaliação foi enviada. Obrigado!";o.classList.add("ok");}});});
render();
loadContext();
</script>
</body>
</html>
